[package]
name = "pixel-physics"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.0"
pixels = "0.17"
rayon = "1.11"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
winit = "0.30"

# The simulation is unusably slow in an unoptimized debug build; per-cell work in
# a hot loop needs at least basic optimization even while developing. Dependencies
# get full optimization since we never step through them.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
