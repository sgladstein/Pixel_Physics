[package]
name = "pixel-physics"
version = "0.1.0"
edition = "2021"
# u64::is_multiple_of (used in update::step and parallel::step) stabilised in
# 1.87 -- that's the real MSRV, not left implicit (issue #10).
rust-version = "1.87"
# Proprietary, all rights reserved -- see LICENSE. Was `license = "MIT"` until
# 2026-08-24; relicensed because the engine is intended to ship as a paid game
# and MIT grants everyone the right to sell it (Reports/dependency-license-
# audit.md holds the reasoning and the third-party inventory). `license-file`
# rather than an SPDX id because no SPDX identifier describes "no grant".
license-file = "LICENSE"
# Belt and braces: proprietary source must never reach crates.io by accident.
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
notify = "8.2.0"
pixels = "0.17"
rayon = "1.11"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
winit = "0.30"

# The simulation is unusably slow in an unoptimized debug build; per-cell work in
# a hot loop needs at least basic optimization even while developing. Dependencies
# get full optimization since we never step through them.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
